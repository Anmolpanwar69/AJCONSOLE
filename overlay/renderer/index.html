<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Console Overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="overlay">
    <!-- ── Search Row ────────────────────────────── -->
    <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>

        <input type="text"
               id="overlaySearchInput"
               placeholder="Search..."
               autocomplete="off"
               spellcheck="false"
               autofocus>

        <div class="action-icons">
            <!-- Camera Snapshot -->
            <button class="icon-btn" id="btnSnapshot" title="Capture Snapshot (F5)">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                    <circle cx="12" cy="12" r="3.2"/>
                    <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                </svg>
            </button>

            <!-- Gallery / Filmstrip -->
            <button class="icon-btn" id="btnGallery" title="Gallery">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                    <path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.89-2-2-2zm0 14H5V6h14v12zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 16h11l-3.54-4.71z"/>
                </svg>
            </button>

            <!-- Save / Presets -->
            <button class="icon-btn" id="btnPresets" title="Save Preset / Quick Favorites">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
            </button>

            <!-- Settings -->
            <button class="icon-btn" id="btnSettings" title="Settings">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>

            <!-- AJ Console Logo (Cyan Prism) -->
            <button class="icon-btn logo-btn" id="btnLogo" title="AJ Console">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
                    <polygon points="12,2 22,21 2,21" stroke="#00c8ff" stroke-width="2.2" fill="rgba(0, 200, 255, 0.2)"/>
                    <circle cx="12" cy="14" r="2.5" fill="#00c8ff"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- ── Category Header ───────────────────────── -->
    <div class="category-header" id="categoryHeader">
        <span class="cat-bullet">•</span>
        <span class="cat-title" id="categoryTitle">Effects</span>
    </div>

    <!-- ── Results List ──────────────────────────── -->
    <div class="results-list" id="resultsList">
        <!-- Rendered by JS -->
    </div>
</div>

<script src="effects-data.js"></script>
<script src="app.js"></script>

</body>
</html>
